name: Build OnePlus 7 Docker Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel with Docker Support & Wi-Fi Module
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ca-certificates curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libssl-dev lld make python3 zip libelf-dev

      - name: Clone Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone LineageOS 22.2 Kernel Source
        run: |
          git clone --depth=1 -b lineage-22.2 https://github.com/LineageOS/android_kernel_oneplus_sm8150.git kernel

      - name: Patch Defconfig and DTS for OnePlus 7 (guacamoleb)
        run: |
          cd kernel

          # Apply OPlus hardware configuration onto sm8150-perf_defconfig
          cat arch/arm64/configs/vendor/oplus.config >> arch/arm64/configs/vendor/sm8150-perf_defconfig

          # Disable unneeded broken overlay build in DTS
          sed -i 's/CONFIG_BUILD_ARM64_DT_OVERLAY=y/# CONFIG_BUILD_ARM64_DT_OVERLAY is not set/g' arch/arm64/configs/vendor/sm8150-perf_defconfig
          
          # Target only OnePlus 7 (18857 / guacamoleb) in DTS to skip broken 7T/Pro device trees
          sed -i '/dts-dirs += 18821/d' arch/arm64/boot/dts/Makefile
          sed -i '/dts-dirs += 18865/d' arch/arm64/boot/dts/Makefile
          sed -i '/dts-dirs += 19801/d' arch/arm64/boot/dts/Makefile
          sed -i '/dts-dirs += 19863/d' arch/arm64/boot/dts/Makefile

          # Append Docker container requirements
          cat << 'EOF' >> arch/arm64/configs/vendor/sm8150-perf_defconfig

          # Docker / Container Requirements
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_NET_NS=y
          CONFIG_USER_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_MEMCG=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_OVERLAY_FS=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_VETH=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_BPF_SYSCALL=y

          # Enable Force Module Loading
          CONFIG_MODULE_FORCE_LOAD=y
          EOF

      - name: Compile Kernel & Wi-Fi Module
        run: |
          cd kernel
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="LineageOS"
          export KBUILD_BUILD_HOST="Docker"

          make O=out vendor/sm8150-perf_defconfig
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbs modules || \
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb modules || \
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image modules

      - name: Build Magisk Wi-Fi Driver Module
        run: |
          mkdir -p wifi-module/system/vendor/lib/modules
          WLAN_KO=$(find kernel/out -name "wlan.ko" | head -n 1)
          if [ -n "$WLAN_KO" ]; then
            echo "Found compiled wlan.ko at $WLAN_KO"
            cp "$WLAN_KO" wifi-module/system/vendor/lib/modules/qca_cld3_wlan.ko
          else
            echo "ERROR: wlan.ko not found!"
            find kernel/out -name "*.ko"
            exit 1
          fi

          cat << 'EOF' > wifi-module/module.prop
id=oneplus7-docker-wifi
name=OnePlus 7 Docker Wi-Fi Driver
version=1.0
versionCode=1
author=thangaraj26
description=Matching Wi-Fi kernel driver (qca_cld3_wlan.ko) for Docker kernel on LineageOS 22.2
EOF

          cd wifi-module
          zip -r9 ../OnePlus7-Docker-WiFi-Module.zip *
          cd ..

      - name: Package Kernel Image & AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=guacamoleb/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=OnePlus7/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=GM1901/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=GM1900/g' anykernel.sh
          sed -i 's/device.name5=.*/device.name5=guacamole/g' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/g' anykernel.sh
          # Remove sample tuna patches
          sed -i '/tuna/d' anykernel.sh

          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          elif [ -f ../kernel/out/arch/arm64/boot/Image ]; then
            cp ../kernel/out/arch/arm64/boot/Image .
          fi

          zip -r9 ../OnePlus7-Docker-Kernel.zip * -x .git README.md *placeholder
          cd ..

          # Also copy raw Image for direct boot_patch.sh packing
          mkdir -p raw-kernel
          cp kernel/out/arch/arm64/boot/Image raw-kernel/
          cp kernel/out/drivers/staging/qcacld-3.0/wlan.ko raw-kernel/qca_cld3_wlan.ko

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus7-Docker-Kernel-Suite
          path: |
            OnePlus7-Docker-Kernel.zip
            OnePlus7-Docker-WiFi-Module.zip
            raw-kernel/Image
            raw-kernel/qca_cld3_wlan.ko
